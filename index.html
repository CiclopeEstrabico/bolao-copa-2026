<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolão Aeronáutica — Copa 2026</title>
  <meta name="description" content="Bolão Copa do Mundo 2026 — Aeronáutica">
  <link rel="icon" type="image/jpeg" href="assets/logo-white.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="header">
    <div style="display:flex;align-items:center;gap:10px;flex:1">
      <img src="assets/logo-white.jpg" alt="Copa 2026" style="height:42px;width:auto;flex-shrink:0"
        onerror="this.textContent='🏆'">
      <div class="header-titulo">Bolão Copa 2026<small>Aeronáutica · 48 Seleções · 104 Jogos</small></div>
    </div>
    <div id="sim-icon" style="display:none"></div>
    <div id="btn-simulacao" onclick="desativarSimulacao()" title="Simulação ativa — clique para sair" style="display:none;cursor:pointer;padding:4px 8px;align-items:center;gap:5px;user-select:none;flex-shrink:0;margin-left:auto">
      <svg width="18" height="22" viewBox="0 0 18 22" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 0 6px #f59e0b)"><path d="M10.5 1L1 13h7l-0.5 8L17 9h-7l1-8z" fill="#f59e0b" stroke="#fbbf24" stroke-width="1" stroke-linejoin="round"/></svg>
      <span style="font-size:.65rem;font-weight:900;color:#f59e0b;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 8px rgba(245,158,11,0.8)">SIM</span>
    </div>
  </header>

  <div class="tabs-wrap">
    <nav class="tabs" role="tablist">
      <button class="tab-btn" data-tab="resultados" role="tab">Resultados</button>
      <button class="tab-btn" data-tab="tabela" role="tab">Torneio</button>
      <button class="tab-btn" data-tab="classificacao" role="tab">Classificação</button>
      <button class="tab-btn" data-tab="grafico" role="tab">Gráfico</button>
      <button class="tab-btn" data-tab="compilacao" role="tab">Compilação</button>
      <button class="tab-btn" data-tab="estatisticas" role="tab">Estatísticas</button>
      <button class="tab-btn" data-tab="regras" role="tab">Regras</button>
      <button class="tab-btn" onclick="window.location.href='aposta.html'" style="color:var(--verde-light);font-weight:800">Apostar</button>
    </nav>
  </div>

  <div class="banner-simulacao hidden" id="banner-simulacao">
    ⚠️ Modo Simulação ativo — resultados NÃO são oficiais
    <button onclick="desativarSimulacao()">Sair</button>
  </div>

  <main class="main">
    <div class="aba-conteudo" data-aba="resultados" id="aba-resultados">
      <div class="loading">
        <div class="spinner"></div>Carregando...
      </div>
    </div>
    <div class="aba-conteudo hidden" data-aba="classificacao" id="aba-classificacao"></div>
    <div class="aba-conteudo hidden" data-aba="tabela" id="aba-tabela"></div>
    <div class="aba-conteudo hidden" data-aba="compilacao" id="aba-compilacao"></div>
    <div class="aba-conteudo hidden" data-aba="grafico" id="aba-grafico"></div>
    <div class="aba-conteudo hidden" data-aba="estatisticas" id="aba-estatisticas"></div>

    <div class="aba-conteudo hidden" data-aba="regras" id="aba-regras"></div>
  </main>

  <!-- Modal Prognostico Poisson -->
  <div class="modal-overlay" id="modal-prog" onclick="if(event.target===this)PROGNOSE.fecharModal()">
    <div class="modal-box" id="modal-prog-body"></div>
  </div>

  <script src="data/config.js"></script>
  <script src="data/teams.js"></script>
  <script src="data/schedule.js"></script>

  <script src="data/venues.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/bracket.js"></script>

  <script src="js/app.js"></script>
  <script src="js/prognose.js"></script>
  <script src="js/ui-jogos.js"></script>
  <script src="js/tab-resultados.js"></script>
  <script src="js/tab-classificacao.js"></script>
  <script src="js/tab-tabela.js"></script>
  <script src="js/tab-compilacao.js"></script>
  <script src="js/tab-grafico.js"></script>
  <script src="js/tab-estatisticas.js"></script>

  <script src="js/tab-regras.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.PROGNOSE && PROGNOSE.loadData) {
        PROGNOSE.loadData();
      }
    });
  </script>
</body>

</html>
