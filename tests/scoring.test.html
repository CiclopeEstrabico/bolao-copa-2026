<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Testes - Bolao Copa 2026</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #eee; }
    h1 { color: #FFD700; }
    h2 { color: #90caf9; margin-top: 20px; }
    .ok   { color: #4caf50; }
    .fail { color: #f44336; font-weight: bold; }
    .info { color: #aaa; font-size: .85rem; }
    .resumo { background: #0d1117; padding: 12px; border-radius: 6px; margin-top: 20px; font-size: 1.1rem; }
    pre { background: #0d1117; padding: 8px; border-radius: 4px; font-size: .8rem; overflow-x: auto; }
  </style>
</head>
<body>
<h1>Suite de Testes — Bolao Copa 2026</h1>
<p class="info">Abra o console (F12) para ver detalhes completos.</p>
<div id="output"></div>

<script src="../data/config.js"></script>
<script src="../data/teams.js"></script>
<script src="../data/schedule.js"></script>
<script src="../js/scoring.js"></script>
<script src="../js/bracket.js"></script>

<script>
// ============================================================
// Framework de testes minimalista
// ============================================================
let _ok = 0, _fail = 0;
const _out = document.getElementById("output");

function testar(descricao, fn) {
  try {
    fn();
    _ok++;
    _out.innerHTML += '<div class="ok">✓ ' + descricao + '</div>';
  } catch(e) {
    _fail++;
    _out.innerHTML += '<div class="fail">✗ ' + descricao + '<br><pre>' + e.message + '</pre></div>';
    console.error(descricao, e);
  }
}

function assert(cond, msg) {
  if (!cond) throw new Error("FALHOU: " + (msg || "condicao falsa"));
}

function assertEq(a, b, msg) {
  if (a !== b) throw new Error((msg||"") + " | esperado: " + JSON.stringify(b) + " | obtido: " + JSON.stringify(a));
}

function section(titulo) {
  _out.innerHTML += '<h2>' + titulo + '</h2>';
}

// ============================================================
// BLOCO 1: Motor de Pontuacao (scoring.js)
// ============================================================
section("1. Motor de Pontuacao — calcularPontosBrutos");

// Resultado basico
testar("Acertar resultado simples (vitoria home): 4 pts (3 base + 1 gols away)", () => {
  // Palpite 2x0, resultado 1x0: acertou resultado, away=0 coincide -> +1 bonus gols
  const r = calcularPontosBrutos({homeGoals:2,awayGoals:0}, {homeGoals:1,awayGoals:0,foi_penaltis:false});
  assertEq(r.total_bruto, 4, "pts brutos: 3+1(gols away coincide)");
  assert(r.acertou === true, "deve ter acertado");
  assert(r.bonus_tipo.includes("gols"), "bonus de gols deve estar presente");
});

testar("Acertar apenas resultado sem bonus (2x1 vs 1x0): 3 pts", () => {
  // Palpite 2x1, resultado 1x0: result=home wins, diff=palpite2-1=1 vs result1-0=1 acertou diff
  // gols: home 2!=1 nao, away 1!=0 nao. Bonus apenas diferenca -> 3+1 = 4 pts
  const r = calcularPontosBrutos({homeGoals:2,awayGoals:1}, {homeGoals:1,awayGoals:0,foi_penaltis:false});
  assertEq(r.total_bruto, 4, "3 base + 1 diferenca");
});

testar("Acertar apenas resultado sem nenhum bonus (3x1 vs 1x0): 3 pts", () => {
  // Palpite 3x1, resultado 1x0: result=home wins, diff palpite=2 vs result=1 -> nao; gols: 3!=1 nao, 1!=0 nao
  const r = calcularPontosBrutos({homeGoals:3,awayGoals:1}, {homeGoals:1,awayGoals:0,foi_penaltis:false});
  assertEq(r.total_bruto, 3, "apenas resultado");
  assertEq(r.bonus_tipo, "apenas_resultado");
});

testar("Errar resultado: 0 pts", () => {
  const r = calcularPontosBrutos({homeGoals:0,awayGoals:1}, {homeGoals:2,awayGoals:0,foi_penaltis:false});
  assertEq(r.total_bruto, 0);
  assertEq(r.acertou, false);
});

testar("Placar exato baixo (1x0, total<4): 6 pts = 3+3", () => {
  const r = calcularPontosBrutos({homeGoals:1,awayGoals:0}, {homeGoals:1,awayGoals:0,foi_penaltis:false});
  assertEq(r.total_bruto, 6);
  assertEq(r.bonus_tipo, "placar_exato");
});

testar("Placar exato alto (2x2, total>=4): 8 pts = 3+5", () => {
  const r = calcularPontosBrutos({homeGoals:2,awayGoals:2}, {homeGoals:2,awayGoals:2,foi_penaltis:false});
  assertEq(r.total_bruto, 8);
  assertEq(r.bonus_tipo, "placar_exato");
});

testar("Resultado + diferenca (2x0 vs 1x0): 4 pts = 3+1", () => {
  const r = calcularPontosBrutos({homeGoals:2,awayGoals:0}, {homeGoals:1,awayGoals:0,foi_penaltis:false});
  // diferenca home=2,away=0: diff palpite=2, resultado diff=1 — NAO acertou diferenca
  // gols: home palpite=2 vs resultado=1 — NAO; away palpite=0 vs resultado=0 — SIM
  assertEq(r.total_bruto, 4, "3 base + 1 gols");
});

testar("Resultado + diferenca e gols (3x1 vs 2x0): 4 pts = 3+1(diff)+1(gols)? Nao: 5 pts", () => {
  // diferenca: palpite 3-1=2, resultado 2-0=2 → acertou diff
  // gols home: palpite=3, resultado=2 → nao; away: palpite=1, resultado=0 → nao
  const r = calcularPontosBrutos({homeGoals:3,awayGoals:1}, {homeGoals:2,awayGoals:0,foi_penaltis:false});
  assertEq(r.total_bruto, 4, "3+1(diff), sem gols");
});

testar("Penaltis: chutou empate = acertou resultado (3 pts)", () => {
  const r = calcularPontosBrutos({homeGoals:1,awayGoals:1}, {homeGoals:1,awayGoals:1,foi_penaltis:true,penaltis_vencedor:"home"});
  assertEq(r.total_bruto, 3, "empate = acertou resultado");
  assert(r.acertou === true);
});

testar("Penaltis: chutou vitoria home = ERROU resultado (0 pts)", () => {
  const r = calcularPontosBrutos({homeGoals:2,awayGoals:0}, {homeGoals:1,awayGoals:1,foi_penaltis:true,penaltis_vencedor:"home"});
  assertEq(r.total_bruto, 0);
  assertEq(r.acertou, false);
});

testar("Penaltis: placar exato nao e valido mesmo com placar igual", () => {
  const r = calcularPontosBrutos({homeGoals:1,awayGoals:1}, {homeGoals:1,awayGoals:1,foi_penaltis:true});
  assert(r.bonus_tipo !== "placar_exato", "penaltis nao tem placar exato");
  assertEq(r.total_bruto, 3, "apenas 3 pts");
});

testar("Empate acertado corretamente (0x0 vs 0x0): 6 pts placar exato", () => {
  const r = calcularPontosBrutos({homeGoals:0,awayGoals:0}, {homeGoals:0,awayGoals:0,foi_penaltis:false});
  assertEq(r.total_bruto, 6);
  assertEq(r.bonus_tipo, "placar_exato");
});

// ============================================================
section("2. Motor de Pontuacao — aplicarFator");

testar("Fase grupos: fator 1.0 → 6 pts = 6.0", () => {
  assertEq(aplicarFator(6, "grupos"), 6.0);
});
testar("32avos: fator 1.2 → 6 pts = 7.2", () => {
  assertEq(aplicarFator(6, "32avos"), 7.2);
});
testar("Oitavas: fator 1.4 → 6 pts = 8.4", () => {
  assertEq(aplicarFator(6, "oitavas"), 8.4);
});
testar("Quartas: fator 1.6 → 3 pts = 4.8", () => {
  assertEq(aplicarFator(3, "quartas"), 4.8);
});
testar("Semis: fator 1.8 → 8 pts = 14.4", () => {
  assertEq(aplicarFator(8, "semis"), 14.4);
});
testar("Final: fator 2.0 → 8 pts = 16.0", () => {
  assertEq(aplicarFator(8, "final"), 16.0);
});
testar("Fator desconhecido: usa 1.0", () => {
  assertEq(aplicarFator(3, "desconhecido"), 3.0);
});

// ============================================================
section("3. Motor de Pontuacao — Exemplo completo da documentacao");

testar("Exemplo doc: Semifinal Brasil x Argentina 2x1 — Joao chutou 2x1 (placar exato baixo x fator 1.8)", () => {
  const r = calcularPontosBrutos({homeGoals:2,awayGoals:1},{homeGoals:2,awayGoals:1,foi_penaltis:false});
  const pts = aplicarFator(r.total_bruto, "semis");
  assertEq(r.total_bruto, 6, "6 pts brutos (placar exato, 3 gols < 4)");
  assertEq(pts, 10.8, "6 x 1.8 = 10.8");
});

testar("Exemplo doc: Maria chutou 1x0 (resultado+diff+gols) = (3+1+1)x1.8 = 9.0", () => {
  // Resultado 2x1, palpite 1x0
  // diff: palpite=1, resultado=1 → acertou diff
  // gols: home palpite=1 vs resultado=2 nao; away palpite=0 vs resultado=1 nao
  // Correto: apenas diferenca = 3+1 = 4 pts brutos
  const r = calcularPontosBrutos({homeGoals:1,awayGoals:0},{homeGoals:2,awayGoals:1,foi_penaltis:false});
  assertEq(r.total_bruto, 4, "3 base + 1 diferenca");
  assertEq(aplicarFator(4, "semis"), 7.2);
});

// ============================================================
section("4. calcularPontosApostador (integracao)");

// Mockar SCHEDULE com 2 jogos simples
const scheduleBackup = window.SCHEDULE;
window.SCHEDULE = [
  { id:"TEST_1", fase:"grupos", grupo:"A", rodada:1, home:"BRA", away:"ARG" },
  { id:"TEST_2", fase:"oitavas", grupo:null, rodada:null, home:"BRA", away:"FRA" },
];

const resultadosTeste = {
  "TEST_1": { homeGoals:2, awayGoals:0, foi_penaltis:false },
  "TEST_2": { homeGoals:1, awayGoals:1, foi_penaltis:true, penaltis_vencedor:"home" },
};
const palpitesTeste = {
  "TEST_1": { homeGoals:2, awayGoals:0 },   // placar exato 2x0 (total<4): 6 pts x 1.0 = 6.0
  "TEST_2": { homeGoals:0, awayGoals:0 },   // empate = acertou penaltis: 3 pts x 1.4 = 4.2
};
const apostadorTeste = { id:"test", token:"abc", nome:"Teste", palpite_campeao:null, palpite_vice:null, palpite_terceiro:null };

testar("Apostador com 2 jogos: total = 6.0 + 4.2 = 10.2", () => {
  const stats = calcularPontosApostador(palpitesTeste, resultadosTeste, apostadorTeste);
  assertEq(stats.total, 10.2, "total de pontos");
  assertEq(stats.acertos_placar_exato, 1, "1 placar exato");
  assertEq(stats.acertos_resultado, 1, "1 acerto de resultado (penaltis)");
  assertEq(stats.erros, 0, "sem erros");
  assertEq(stats.jogos_realizados, 2);
});

testar("Apostador sem palpites: 0 pontos, 2 sem_palpite", () => {
  const stats = calcularPontosApostador({}, resultadosTeste, apostadorTeste);
  assertEq(stats.total, 0);
  assertEq(stats.sem_palpite, 2);
});

// Restaurar SCHEDULE
window.SCHEDULE = scheduleBackup;

// ============================================================
section("5. Bracket — Classificacao de Grupo");

// Simular resultados do Grupo C (BRA, MAR, HAI, SCO)
const resGrupoC = {
  "C_R1_BRA_MAR": { homeGoals:2, awayGoals:0, foi_penaltis:false }, // BRA vence
  "C_R1_HAI_SCO": { homeGoals:0, awayGoals:1, foi_penaltis:false }, // SCO vence
  "C_R2_SCO_MAR": { homeGoals:1, awayGoals:1, foi_penaltis:false }, // empate
  "C_R2_BRA_HAI": { homeGoals:3, awayGoals:0, foi_penaltis:false }, // BRA vence
  "C_R3_SCO_BRA": { homeGoals:0, awayGoals:2, foi_penaltis:false }, // BRA vence
  "C_R3_MAR_HAI": { homeGoals:2, awayGoals:0, foi_penaltis:false }, // MAR vence
};

testar("Grupo C: Brasil em 1o, Escocia ou Marrocos em 2o", () => {
  const standing = BRACKET.calcularClassificacaoGrupo("C", resGrupoC);
  assertEq(standing[0].code, "BRA", "1o lugar deve ser Brasil");
  assert(standing[0].V === 3, "Brasil deve ter 3 vitorias");
  assert(standing[0].Pts === 9, "Brasil deve ter 9 pontos");
});

testar("Grupo C: standing tem 4 times", () => {
  const standing = BRACKET.calcularClassificacaoGrupo("C", resGrupoC);
  assertEq(standing.length, 4);
});

testar("Grupo C com resultados parciais (2 jogos): nao quebra", () => {
  const resParc = { "C_R1_BRA_MAR": { homeGoals:2, awayGoals:0, foi_penaltis:false } };
  const standing = BRACKET.calcularClassificacaoGrupo("C", resParc);
  assert(standing.length === 4, "sempre retorna 4 times");
  assertEq(standing[0].code, "BRA", "BRA na frente com 3pts");
});

testar("Grupo vazio (sem resultados): todos com 0 pts", () => {
  const standing = BRACKET.calcularClassificacaoGrupo("A", {});
  assertEq(standing.length, 4);
  assert(standing.every(t => t.Pts === 0), "todos com 0 pts");
});

// ============================================================
section("6. Bracket — Preenchimento automatico");

testar("Com grupo C completo: bracket R32 deve ter BRA como home ou away", () => {
  const bracket = BRACKET.preencherBracket(resGrupoC);
  // Verificar que algum jogo R32 tem BRA
  const temBRA = Object.values(bracket).some(b => b.home === "BRA" || b.away === "BRA");
  assert(temBRA, "BRA deve aparecer em algum jogo do R32");
});

testar("Sem resultados: bracket R32 existe e tem posicao de referencia", () => {
  const bracket = BRACKET.preencherBracket({});
  const r32 = bracket["R32_1"];
  assert(r32 !== undefined, "R32_1 deve existir no bracket");
  // Com grupos vazios (0 pts), ainda ha um time "classificado" por desempate de nome.
  // O importante e que a estrutura existe e tem homePos/awayPos para exibicao correta.
  assert(r32.homePos !== undefined, "deve ter homePos para exibicao: " + JSON.stringify(r32));
  assert(r32.awayPos !== undefined, "deve ter awayPos");
  // homeResolved e true porque ha um time com 0 pts no topo do grupo (por ordem de array)
  // Isso e comportamento correto - mostrara o "lider" mesmo sem jogos realizados
  assert(typeof r32.home === "string" || r32.home === null, "home deve ser string ou null");
});

testar("descricaoPosicao: converte '1A' para texto legivel", () => {
  const desc = BRACKET.descricaoPosicao("1A");
  assert(desc.includes("1") && desc.includes("A"), "deve conter posicao e grupo: " + desc);
});

testar("descricaoPosicao: converte '3X1' para texto legivel", () => {
  const desc = BRACKET.descricaoPosicao("3X1");
  assert(desc.includes("3") || desc.includes("melhor"), "deve ser legivel: " + desc);
});

// ============================================================
section("7. Dados Estaticos — schedule.js e teams.js");

testar("SCHEDULE tem exatamente 104 jogos", () => {
  assertEq(window.SCHEDULE.length, 104, "104 jogos");
});

testar("SCHEDULE tem 72 jogos de grupos", () => {
  const grupos = window.SCHEDULE.filter(j => j.fase === "grupos").length;
  assertEq(grupos, 72);
});

testar("SCHEDULE tem 16 jogos de 32avos", () => {
  assertEq(window.SCHEDULE.filter(j => j.fase === "32avos").length, 16);
});

testar("SCHEDULE tem 8 jogos de oitavas", () => {
  assertEq(window.SCHEDULE.filter(j => j.fase === "oitavas").length, 8);
});

testar("SCHEDULE tem 4 jogos de quartas", () => {
  assertEq(window.SCHEDULE.filter(j => j.fase === "quartas").length, 4);
});

testar("SCHEDULE tem 2 semifinais, 1 terceiro, 1 final", () => {
  assertEq(window.SCHEDULE.filter(j => j.fase === "semis").length, 2);
  assertEq(window.SCHEDULE.filter(j => j.fase === "terceiro").length, 1);
  assertEq(window.SCHEDULE.filter(j => j.fase === "final").length, 1);
});

testar("SCHEDULE: todos os jogos tem ID unico", () => {
  const ids = window.SCHEDULE.map(j => j.id);
  const unicos = new Set(ids);
  assertEq(unicos.size, ids.length, "IDs duplicados detectados");
});

testar("SCHEDULE: todos os jogos tem data UTC valida", () => {
  const invalidos = window.SCHEDULE.filter(j => isNaN(new Date(j.utc).getTime()));
  assertEq(invalidos.length, 0, "jogos com data invalida: " + invalidos.map(j=>j.id).join(","));
});

testar("SCHEDULE: Brasil esta no Grupo C, jogo 1 vs Marrocos", () => {
  const jogo = window.SCHEDULE_BY_ID["C_R1_BRA_MAR"];
  assert(jogo !== undefined, "jogo C_R1_BRA_MAR deve existir");
  assertEq(jogo.home, "BRA");
  assertEq(jogo.away, "MAR");
  assertEq(jogo.grupo, "C");
});

testar("TEAMS tem 48 selecoes", () => {
  assertEq(window.TEAMS.length, 48);
});

testar("TEAMS: todos os 12 grupos (A-L) tem exatamente 4 times", () => {
  for (const letra of "ABCDEFGHIJKL".split("")) {
    const count = window.TEAMS.filter(t => t.group === letra).length;
    assertEq(count, 4, "Grupo " + letra + " tem " + count + " times (esperado 4)");
  }
});

testar("TEAMS_BY_CODE: lookup BRA funciona", () => {
  const bra = window.TEAMS_BY_CODE["BRA"];
  assert(bra !== undefined, "BRA deve estar no lookup");
  assertEq(bra.name, "Brasil");
  assertEq(bra.group, "C");
});

testar("CONFIG: fatores de fase corretos", () => {
  const f = window.CONFIG.pontuacao.fatores_fase;
  assertEq(f.grupos, 1.0);
  assertEq(f["32avos"], 1.2);
  assertEq(f.oitavas, 1.4);
  assertEq(f.quartas, 1.6);
  assertEq(f.semis, 1.8);
  assertEq(f.terceiro, 1.8);
  assertEq(f.final, 2.0);
});

testar("CONFIG: 6 fases de apostas definidas", () => {
  assertEq(window.CONFIG.fases_apostas.length, 6);
});

testar("CONFIG: senha admin correta", () => {
  assertEq(window.CONFIG.admin_senha, "#bolao2026#");
});

// ============================================================
section("8. gerarRanking — Integracao");

// Setup mock
const schedBkp = window.SCHEDULE;
window.SCHEDULE = [
  { id:"R_1", fase:"grupos", grupo:"A", home:"BRA", away:"ARG" },
  { id:"R_2", fase:"grupos", grupo:"A", home:"URU", away:"COL" },
];
const resRanking = {
  "R_1": { homeGoals:2, awayGoals:1, foi_penaltis:false },
  "R_2": { homeGoals:0, awayGoals:0, foi_penaltis:false },
};
const palRanking = {
  "p1": { "R_1": { homeGoals:2, awayGoals:1 }, "R_2": { homeGoals:0, awayGoals:0 } }, // 6+6 = 12 pts
  "p2": { "R_1": { homeGoals:1, awayGoals:0 }, "R_2": { homeGoals:1, awayGoals:1 } }, // 4+4 = 8 pts (diff+gols vs resultado)
  "p3": { "R_1": { homeGoals:0, awayGoals:0 } },                                      // 0 pts (errou)
};
const participants = [
  { id:"p1", token:"t1", nome:"Ana", palpite_campeao:null, palpite_vice:null, palpite_terceiro:null },
  { id:"p2", token:"t2", nome:"Bob", palpite_campeao:null, palpite_vice:null, palpite_terceiro:null },
  { id:"p3", token:"t3", nome:"Cid", palpite_campeao:null, palpite_vice:null, palpite_terceiro:null },
];

testar("Ranking: Ana em 1o com 12 pts (2 placares exatos)", () => {
  const ranking = gerarRanking(palRanking, resRanking, participants);
  assertEq(ranking[0].participante.id, "p1", "Ana deve ser 1a");
  assertEq(ranking[0].stats.total, 12.0, "Ana deve ter 12 pts");
  assertEq(ranking[0].posicao, 1);
});

testar("Ranking: Cid em 3o com 0 pts", () => {
  const ranking = gerarRanking(palRanking, resRanking, participants);
  const cid = ranking.find(r => r.participante.id === "p3");
  assertEq(cid.stats.total, 0);
  assertEq(cid.posicao, 3);
});

window.SCHEDULE = schedBkp;

// ============================================================
// RESUMO FINAL
// ============================================================
const total = _ok + _fail;
_out.innerHTML += `<div class="resumo">
  <strong>Resultado: ${_ok}/${total} testes passaram</strong>
  ${_fail > 0 ? '<span style="color:#f44336"> | ' + _fail + ' FALHOU(aram)</span>' : '<span style="color:#4caf50"> — Todos OK!</span>'}
</div>`;

console.log("Testes concluidos: " + _ok + "/" + total);
</script>
</body>
</html>
