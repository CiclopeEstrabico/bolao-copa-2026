<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin - Bolão Copa 2026</title>
  <link rel="icon" type="image/jpeg" href="assets/logo-white.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <img src="assets/logo-white.jpg" alt="Copa 2026" class="header-logo" style="height:42px;width:auto;flex-shrink:0" onerror="this.style.display='none'">
  <div class="header-titulo">Admin — Bolão Copa 2026<small>Painel de Controle</small></div>
  <div class="header-acoes">
    <button class="header-btn header-btn-salvar" id="btn-salvar-header" onclick="gravarTudoAdmin()" title="Gravar Resultados Oficiais">
      <span class="header-btn-icon">💾</span>
      <span class="header-btn-label">Salvar</span>
    </button>
    <a href="index.html" class="header-btn header-btn-ranking" title="Ver Ranking">
      <span class="header-btn-icon">🏆</span>
      <span class="header-btn-label">Ranking</span>
    </a>
  </div>
</header>

<div class="tabs-wrap">
  <nav class="tabs" role="tablist">
    <button class="tab-btn" data-tab="resultados" role="tab">⚽ Resultados</button>
    <button class="tab-btn" data-tab="apostadores" role="tab">👥 Apostadores</button>
    <button class="tab-btn" data-tab="tokens" role="tab">🔑 Tokens</button>
  </nav>
</div>

<main class="main">
  <div class="aba-conteudo" data-aba="resultados" id="aba-resultados">
    <div class="loading"><div class="spinner"></div>Carregando...</div>
  </div>
  <div class="aba-conteudo hidden" data-aba="apostadores" id="aba-apostadores">
    <div class="loading"><div class="spinner"></div>Carregando...</div>
  </div>
  <div class="aba-conteudo hidden" data-aba="tokens" id="aba-tokens">
    <div class="loading"><div class="spinner"></div>Carregando...</div>
  </div>
</main>

<script src="data/config.js"></script>
<script src="data/teams.js"></script>
<script src="data/schedule.js"></script>
<script src="data/venues.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/scoring.js"></script>
<script src="data/third_place_combinations.js"></script>
  <script src="js/bracket.js"></script>
<script src="js/app.js"></script>
<script src="js/ui-jogos.js"></script>
<script src="js/prognose.js"></script>
<script src="js/admin.js"></script>
<script src="js/atualizar_modelo.js"></script>
</body>
</html>
